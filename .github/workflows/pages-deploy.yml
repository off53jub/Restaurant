name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/keen-ritchie-TZN7D
    paths:
      - 'web/**'
      - 'tools/build_web_db.py'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Verify secret is configured
        env:
          TOKEN: ${{ secrets.PAGES_APP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Repository secret PAGES_APP_TOKEN is not set."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Build (token-gated DB URL)
        working-directory: web
        env:
          VITE_DB_VERSION: ${{ github.sha }}
          VITE_APP_TOKEN: ${{ secrets.PAGES_APP_TOKEN }}
          VITE_DB_URL: ./shops-web-${{ secrets.PAGES_APP_TOKEN }}.db.gz
        run: npm run build

      - name: Rename DB to token-bearing filename
        env:
          TOKEN: ${{ secrets.PAGES_APP_TOKEN }}
        run: |
          mv "web/dist/shops-web.db.gz" "web/dist/shops-web-${TOKEN}.db.gz"
          ls -la web/dist/shops-web-*.db.gz

      - name: Inject 404 fallback for SPA routing
        run: cp web/dist/index.html web/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
